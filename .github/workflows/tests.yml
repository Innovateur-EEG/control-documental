name: Tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Compile application and migration scripts
        run: python -m compileall -q app scripts
      - name: Run isolated unit tests
        run: >-
          python -m pytest -q
          tests/test_gestor_logic.py
          tests/test_dynamic_fields.py
          tests/test_evidencias.py
